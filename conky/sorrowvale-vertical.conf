conky.config = {
    alignment = 'top_left',
    background = false,
    update_interval = 1,
    double_buffer = true,

    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    minimum_width = 400,
    minimum_height = 600,

    gap_x = 65,
    gap_y = 90,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,

    use_xft = true,
    font = 'JetBrains Mono:size=9',

    default_color = 'D8D3CC',

    color1 = 'A93232',
    color2 = '777777',
    color3 = 'F0ECE6',
    color4 = 'A9A39B',

    cpu_avg_samples = 2,
};

conky.text = [[
${font JetBrains Mono:size=11}${color3}S O R R O W V A L E

${voffset 22}${font Noto Serif:size=40}${color3}${time %H:%M}
${voffset 2}${font JetBrains Mono:size=9}${color1}${time %d · %m · %Y}
${color2}${time %A}


${voffset 35}${font JetBrains Mono:bold:size=8}${color3}SYSTEM ${color1}${hr 1}

${voffset 12}${font JetBrains Mono:size=8}${color2}CPU${alignr}${color3}${cpu}%
${color2}RYZEN 7 2700X${alignr}${color3}${execi 3 sensors | awk '/Tdie:/ {print $2; exit}'}

${voffset 8}${color2}GPU${alignr}${color3}${execi 2 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits}%
${color2}GTX 1660${alignr}${color3}${execi 3 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits}°C

${voffset 8}${color2}MEMORY${alignr}${color3}${mem}


${voffset 35}${color1}${hr 1}

${voffset 18}${alignc}${font Noto Serif:size=18}${color1}◇

${voffset 10}${alignc}${font JetBrains Mono:size=7}${color2}THE VALLEY REMAINS

${voffset 5}${alignc}${font JetBrains Mono:size=7}${color4}${nodename}
]];
